<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Click The Button</title>
</head>
<body>    
    <!-- Our main container  -->
    <div class="container">

        <!-- Our title. -->
        <h1 class="main-title">Click the Button!</h1>

        <!-- Our "Click Me!" button. -->
        <button id="clickBtn">Click Me!</button>


        <!-- A div that contains our text and click counter. -->
        <div>
            <!-- Our text. -->
            <p class="btn-count-label">You have clicked the button this many times:</p>

            <!-- Our click count text, set to 0 by default. -->
            <p class="btn-count" id="btnCount">0</p>
        </div>

        <!-- Our "reset clicks" button. -->
        <button id="resetBtn">reset clicks</button>

    </div>
    <!-- Our <script> tag, linking the index.html file to the main.js file -->
    <script src="main.js" defer></script>
</body>
</html>
